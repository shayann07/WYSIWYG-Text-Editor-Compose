# Project overrides on top of Detekt's default configuration (buildUponDefaultConfig).
# Keep this list short; every entry needs a reason.

complexity:
  CyclomaticComplexMethod:
    # A flat `when` mapping each intent/command to one call is the MVI dispatch shape;
    # its branches are not decision complexity.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # Facades such as EditorViewModel expose one small function per query. Count only
    # the public surface a reader must understand.
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    thresholdInEnums: 20
    ignorePrivate: true
    ignoreOverridden: true

# tests/desktop-harness is the qualification test consumer but lives in a jvmMain
# source set, so Detekt's default test-source patterns miss it. Extend those patterns
# to it only for the rules Detekt itself exempts test code from; every other rule
# applies to the harness in full.
exceptions:
  TooGenericExceptionCaught:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/tests/desktop-harness/**']
naming:
  FunctionNaming:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/tests/desktop-harness/**']
style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts', '**/tests/desktop-harness/**']
