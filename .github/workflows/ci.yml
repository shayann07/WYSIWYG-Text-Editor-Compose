# DIAGNOSTIC BRANCH ONLY. Not a replacement for the ordinary CI lane.
name: ComposeDoc CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: composedoc-api37-environment-trial
  cancel-in-progress: false
jobs:
  android-environment-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_PACKAGE: system-images;android-37.1;google_apis_ps16k;x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Verify trial host contracts and transfer the exact failed-CI binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir trial-evidence
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/composedoc-api37-trial-avds" >> "$GITHUB_ENV"
          python -m unittest discover -s tooling/verification -p 'test_android_trial*.py' -v
          python -c "import sys;sys.path.insert(0,'tooling/verification');from android_trial_artifacts import verify_harness;verify_harness('trial-harness')"
          cp trial-harness/source-manifest.json trial-evidence/host-helper-source-manifest.json
          ln -s "$GITHUB_WORKSPACE/tests" trial-harness/tests
          gh api repos/shayann07/WYSIWYG-Text-Editor-Compose/actions/artifacts/12841796990 > trial-evidence/artifact-metadata.json
          python -c "import sys,json;sys.path.insert(0,'tooling/verification');from android_trial_artifacts import validate_metadata;validate_metadata(json.load(open('trial-evidence/artifact-metadata.json')))"
          gh api repos/shayann07/WYSIWYG-Text-Editor-Compose/actions/artifacts/12841796990/zip > "$RUNNER_TEMP/retained-artifact.zip"
          python tooling/verification/android_trial_artifacts.py --archive "$RUNNER_TEMP/retained-artifact.zip" --metadata trial-evidence/artifact-metadata.json --output-dir trial-evidence/relocated
      - name: Install only the reviewed image and emulator versions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 180 https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip -o "$RUNNER_TEMP/emulator.zip"
          echo "f41f9e31eb5ca64926603c03265c50bbc0ff4172  $RUNNER_TEMP/emulator.zip" | sha1sum --check
          unzip -oq "$RUNNER_TEMP/emulator.zip" -d "$ANDROID_HOME"
          python tooling/verification/android_trial_runtime.py --sdk "$ANDROID_HOME" --output-dir trial-evidence/host-runtime
          curl --fail --silent --show-error --max-time 30 https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-3.xml -o "$RUNNER_TEMP/image-catalogue.xml"
          python tooling/verification/android_trial_identity.py --metadata "$RUNNER_TEMP/image-catalogue.xml" --output trial-evidence/catalogue-identity.json
          sdkmanager "$IMAGE_PACKAGE"
          curl --fail --silent --show-error --max-time 300 https://dl.google.com/android/repository/sys-img/google_apis/x86_64-ps16k-37.1_r09.zip -o "$RUNNER_TEMP/pinned-image.zip"
          echo "35c0da1cd298f3426a5b48233f59515097446a28  $RUNNER_TEMP/pinned-image.zip" | sha1sum --check
          python tooling/verification/android_trial_identity.py --metadata "$ANDROID_HOME/system-images/android-37.1/google_apis_ps16k/x86_64/package.xml" --installed --archive "$RUNNER_TEMP/pinned-image.zip" --output trial-evidence/installed-image-identity.json
          cp "$ANDROID_HOME/system-images/android-37.1/google_apis_ps16k/x86_64/package.xml" trial-evidence/image-package.xml
          cp "$ANDROID_HOME/system-images/android-37.1/google_apis_ps16k/x86_64/build.prop" trial-evidence/image-build.prop
          "$ANDROID_HOME/emulator/emulator" -version > trial-evidence/emulator-version.txt
          uname -a > trial-evidence/host-kernel.txt
          cat /etc/os-release > trial-evidence/host-os.txt
      - name: One fresh owned boot and unchanged cold qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name composedoc_ci --device pixel_7 --package "$IMAGE_PACKAGE"
          printf 'hw.cpu.ncore=2\nhw.ramSize=6144\ndisk.dataPartition.size=2048M\nhw.keyboard=no\n' >> "$ANDROID_AVD_HOME/composedoc_ci.avd/config.ini"
          cp "$ANDROID_AVD_HOME/composedoc_ci.avd/config.ini" trial-evidence/avd-config.ini
          sudo chmod a+rw /dev/kvm
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd composedoc_ci -port 5580 -no-window -no-audio -no-snapshot -no-boot-anim -gpu software -feature -Vulkan > trial-evidence/emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > trial-evidence/owned-emulator.pid
          sleep 1
          kill -0 "$emulator_pid"
          python trial-harness/tooling/verification/android_check.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt trial-evidence/relocated/consumer.json --wait-only --readiness-timeout 300 --output-dir trial-evidence/preflight
          python tooling/verification/android_trial_identity.py --metadata "$ANDROID_HOME/system-images/android-37.1/google_apis_ps16k/x86_64/package.xml" --installed --device --output trial-evidence/guest-identity.json
          adb -s emulator-5580 shell svc wifi disable
          adb -s emulator-5580 shell svc data disable
          adb -s emulator-5580 shell settings put system screen_off_timeout 1800000
          adb -s emulator-5580 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5580 shell wm dismiss-keyguard
          adb -s emulator-5580 shell ime list -s > trial-evidence/ime-list.txt
          adb -s emulator-5580 shell ime enable com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
          adb -s emulator-5580 shell ime set com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
          adb -s emulator-5580 shell settings put secure show_ime_with_hard_keyboard 1
          python trial-harness/tooling/verification/android_check.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt trial-evidence/relocated/consumer.json --output-dir trial-evidence/qualification
          python trial-harness/tooling/verification/android_clipboard.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt trial-evidence/relocated/consumer.json --output-dir trial-evidence/clipboard
      - name: Stop only the trial-owned emulator
        if: always()
        shell: bash
        run: |
          if test -f trial-evidence/owned-emulator.pid; then
            if adb -s emulator-5580 emu avd name | grep -qx composedoc_ci; then
              adb -s emulator-5580 emu kill
            else
              echo 'Owned identity unavailable; do not target another device.'
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: api37-google-apis-environment-trial-${{ github.sha }}
          path: trial-evidence
          if-no-files-found: error
          retention-days: 14
