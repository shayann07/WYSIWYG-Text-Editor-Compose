name: ComposeDoc CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: docs-and-frozen-hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tests/suites/integration/c0
      - run: python tooling/docs/validate_docs.py
      - run: node tooling/verification/v6.mjs
      - run: python -m unittest discover -s tooling/governance -p 'test_*.py'
  quality:
    name: architecture-and-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon architectureCheck apiCheck detekt ktlintCheck
  build:
    name: build-and-verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --ignore-scripts --prefix tests/suites/integration/c0
      - run: python -m pip install -r tooling/verification/requirements.txt
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: .\gradlew.bat --no-daemon check apiCheck
      - run: python tooling/verification/test_verification.py
      - run: python tooling/verification/verify.py --workspace-milestone
      - run: python tooling/verification/consumer_check.py --android --output-dir tests/local-evidence/consumer/ci
  android:
    name: android-packaged-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build outside-checkout consumers from binary metadata
        run: xvfb-run -a python tooling/verification/consumer_check.py --android --output-dir tests/local-evidence/consumer/android-ci
      - name: Enable acceleration on the disposable hosted runner
        run: sudo chmod a+rw /dev/kvm
      - name: Verify on a bounded disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          system-image-api-level: '37.1'
          target: google_apis_playstore_ps16k
          arch: x86_64
          profile: pixel_7
          avd-name: composedoc_ci
          emulator-port: 5580
          ram-size: 2048M
          disk-size: 1024M
          emulator-boot-timeout: 300
          # API 37's emulator supports software; retain startup output in the job log.
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -no-netsim -gpu software -feature -Vulkan
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$ANDROID_AVD_HOME/composedoc_ci.avd/config.ini"
          script: |
            adb -s emulator-5580 shell settings put secure show_ime_with_hard_keyboard 1
            python tooling/verification/android_check.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt tests/local-evidence/consumer/android-ci/results.json --output-dir tests/local-evidence/android/ci
      - name: Retain packaged adapter receipts and raw failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-packaged-adapter-${{ github.sha }}
          path: |
            tests/local-evidence/consumer/android-ci
            tests/local-evidence/android/ci
          if-no-files-found: warn
  ios:
    name: ios-build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      # Apple targets are only configured on macOS. Compiling and running the shared
      # tests on the simulator does not qualify native iOS editing or input.
      - run: ./gradlew --no-daemon --console=plain compileKotlinIosArm64 compileKotlinIosSimulatorArm64 iosSimulatorArm64Test
