name: ComposeDoc CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: docs-and-frozen-hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --prefix tests/suites/integration/c0
      - run: python tooling/docs/validate_docs.py
      - run: python -m unittest discover -s tooling/verification -p 'test_poppler_tool.py'
      - run: python -m unittest discover -s tooling/docs -p 'test_*.py'
      - run: python tooling/verification/reproduce_inherited.py
      - run: python -m unittest discover -s tooling/verification -p 'test_inherited_*.py'
      - run: python tooling/docs/validate_proposals.py
      - run: python -m unittest discover -s tooling/governance -p 'test_*.py'
  quality:
    name: architecture-and-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon architectureCheck apiCheck androidApiCheck detekt ktlintCheck
  build:
    name: build-and-verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --ignore-scripts --prefix tests/suites/integration/c0
      - run: python -m pip install -r tooling/verification/requirements.txt
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: .\gradlew.bat --no-daemon check apiCheck
      - run: python tooling/verification/test_verification.py
      - run: python tooling/verification/verify.py --workspace-milestone
      - run: python tooling/verification/consumer_check.py --android --output-dir tests/local-evidence/consumer/ci
  android:
    name: android-packaged-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build outside-checkout consumers from binary metadata
        run: xvfb-run -a python tooling/verification/consumer_check.py --android-peer --output-dir tests/local-evidence/consumer/android-ci
      - name: Start the disposable emulator and wait for unlocked services
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-37.1;google_apis_playstore_ps16k;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/composedoc-ci-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name composedoc_ci --device pixel_7 --package 'system-images;android-37.1;google_apis_playstore_ps16k;x86_64'
          printf 'hw.cpu.ncore=2\nhw.ramSize=6144\ndisk.dataPartition.size=2048M\nhw.keyboard=no\n' >> "$ANDROID_AVD_HOME/composedoc_ci.avd/config.ini"
          sudo chmod a+rw /dev/kvm
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd composedoc_ci -port 5580 -no-window -no-audio -no-snapshot -no-boot-anim -gpu software -feature -Vulkan > emulator.log 2>&1 &
          emulator_pid=$!
          sleep 1
          if ! kill -0 "$emulator_pid"; then cat emulator.log; exit 1; fi
          python tooling/verification/android_check.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt tests/local-evidence/consumer/android-ci/results.json --wait-only --readiness-timeout 300 --output-dir tests/local-evidence/android/preflight
      - name: Verify the independently packaged APK
        shell: bash
        run: |
          # This offline editor does not need first-boot Play Store network provisioning.
          adb -s emulator-5580 shell svc wifi disable
          adb -s emulator-5580 shell svc data disable
          adb -s emulator-5580 shell dumpsys meminfo > pre-test-memory.txt
          # Credential-unlocked storage is distinct from an interactive, unlocked display.
          adb -s emulator-5580 shell settings put system screen_off_timeout 1800000
          adb -s emulator-5580 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5580 shell wm dismiss-keyguard
          adb -s emulator-5580 shell ime list -s > pre-test-ime-list.txt
          adb -s emulator-5580 shell ime enable com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
          adb -s emulator-5580 shell ime set com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
          adb -s emulator-5580 shell settings put secure show_ime_with_hard_keyboard 1
          adb -s emulator-5580 shell dumpsys input_method > pre-test-input-method.txt
          adb -s emulator-5580 shell dumpsys power > pre-test-power.txt
          adb -s emulator-5580 shell dumpsys window policy > pre-test-window-policy.txt
          python tooling/verification/android_startup_probe.py --serial emulator-5580 --avd-name composedoc_ci --output-dir tests/local-evidence/android/startup-probe -- python tooling/verification/android_check.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt tests/local-evidence/consumer/android-ci/results.json --output-dir tests/local-evidence/android/ci
      - name: Verify cross-UID clipboard after publisher process death
        run: python tooling/verification/android_clipboard.py --serial emulator-5580 --avd-name composedoc_ci --consumer-receipt tests/local-evidence/consumer/android-ci/results.json --output-dir tests/local-evidence/android/clipboard-ci
      - name: Stop only the disposable emulator
        if: always()
        shell: bash
        run: |
          if adb -s emulator-5580 get-state >/dev/null 2>&1; then
            adb -s emulator-5580 emu kill
          else
            echo 'Disposable emulator is not running; no device targeted.'
          fi
      - name: Retain packaged adapter receipts and raw failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-packaged-adapter-${{ github.sha }}
          path: |
            tests/local-evidence/consumer/android-ci
            tests/local-evidence/android/ci
            tests/local-evidence/android/clipboard-ci
            tests/local-evidence/android/preflight
            tests/local-evidence/android/startup-probe
            emulator.log
            pre-test-*.txt
          if-no-files-found: warn
  ios:
    name: ios-build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      # Apple targets are only configured on macOS. Compiling and running the shared
      # tests on the simulator does not qualify native iOS editing or input.
      - run: ./gradlew --no-daemon --console=plain compileKotlinIosArm64 compileKotlinIosSimulatorArm64 iosSimulatorArm64Test
